---

- name: "Instalar aplicaciones de audio para {{ target_user }}"
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: user
    remote: flathub
  loop: "{{ flatpak_audio | default([]) }}"

- name: "Actualizar todas las aplicaciones de {{ target_user }}"
  command: flatpak update --user -y
  when: flatpak_update | default(true)
  register: update_output
  changed_when: "'Installing' in update_output.stdout or 'Updating' in update_output.stdout"

