---
# Ruta base para clonar repos desde GitHub
github_dir: "/home/{{ ansible_user_id }}/github"

# Directorios específicos para proyectos

# Ruta al archivo .deb de web-greeter (este está dentro del rol)
web_greeter_deb_path: "{{ role_path }}/files/web-greeter-3.5.3-debian.deb"

# Directorio estándar para programas compilados manualmente
install_prefix: "/usr/local"

desktop_packages:
  - sway
  - swaybg
  - swaylock
  - swayidle
  - mako-notifier
  - xdg-desktop-portal
  - xdg-desktop-portal-wlr
  - swayimg
  - papersway
  - cava
  - gammastep
  - jq

cavacore_dependencies:
  - libfftw3-dev
  - libasound2-dev
  - libpulse-dev
  - libiniparser-dev
  - libpipewire-0.3-dev
  - libjack-jackd2-dev
  - libsdl2-dev
  - libtool

wayland_dependencies:
  - wayland-protocols
  - libwayland-dev
  - libpango1.0-dev

waybar_dependencies:
  - clang-tidy
  - gobject-introspection
  - libdbusmenu-gtk3-dev
  - libevdev-dev
  - libfmt-dev
  - libgirepository1.0-dev
  - libgtk-3-dev
  - libgtkmm-3.0-dev
  - libinput-dev
  - libjsoncpp-dev
  - libmpdclient-dev
  - libnl-3-dev
  - libnl-genl-3-dev
  - libpulse-dev
  - libsigc++-3.0-dev
  - libspdlog-dev
  - libwayland-dev
  - scdoc
  - upower
  - libxkbregistry-dev
