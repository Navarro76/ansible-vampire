---
# ========== Instalación de mpdris2-rs ==========

- name: Limpiar rastro de clonaciones fallidas
  become: true
  ansible.builtin.file:
    path: "/tmp/mpdris2-rs"
    state: absent

- name: Clonar repositorio mpdris2-rs
  ansible.builtin.git:
    repo: "https://github.com/szclsya/mpdris2-rs"
    dest: "/tmp/mpdris2-rs"
    version: trunk
  # Ejecutamos como tu usuario para que sea el dueño desde el inicio
  become: true
  become_user: "{{ target_user }}"

- name: Asegurar que el usuario es dueño de la carpeta de compilación
  become: true
  ansible.builtin.file:
    path: "/tmp/mpdris2-rs"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    recurse: yes

- name: Compilar mpdris2-rs en modo release
  ansible.builtin.command:
    cmd: "/home/{{ target_user }}/.cargo/bin/cargo build --release"
    chdir: "/tmp/mpdris2-rs"
  environment:
    PATH: "/home/{{ target_user }}/.cargo/bin:{{ ansible_env.PATH }}"
  become: true
  become_user: "{{ target_user }}"

#- name: Compilar mpdris2-rs en modo release
#  ansible.builtin.command:
#    cmd: cargo build --release
#    chdir: "/tmp/mpdris2-rs"

- name: Crear directorio /usr/local/bin si no existe
  become: true
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: '0755'

- name: Copiar binario mpdris2-rs a /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "/tmp/mpdris2-rs/target/release/mpdris2-rs"
    dest: /usr/local/bin/mpdris2-rs
    mode: '0755'
    remote_src: true

# Crear una imagen local con tu binario para Podman

- name: Crear un Dockerfile temporal para la imagen local
  ansible.builtin.copy:
    dest: "/tmp/mpdris2-rs/Dockerfile"
    content: |
      FROM debian:trixie-slim
      RUN apt-get update && apt-get install -y libdbus-1-3 && rm -rf /var/lib/apt/lists/*
      COPY mpdris2-rs /usr/bin/mpdris2-rs
      ENTRYPOINT ["/usr/bin/mpdris2-rs"]

- name: Construir la imagen local de Podman
  ansible.builtin.command:
    cmd: "podman build --network=host -t localhost/mpdris2-local -f /tmp/mpdris2-rs/Dockerfile /tmp/mpdris2-rs/target/release/"
  become: true
  become_user: "{{ target_user }}"


