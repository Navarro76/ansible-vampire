---

# ========== Servicio mpdris2-rs ==========

- name: Crear script wrapper minimalista para mpdris2-rs
  ansible.builtin.copy:
    dest: "/home/{{ target_user }}/.config/bin/mpdris2-rs-wrapper.sh"
    content: |
      #!/bin/bash
      # Esperar a que D-Bus esté disponible
      while [ ! -S "/run/user/$(id -u)/bus" ]; do
          sleep 1
      done
      export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"

      # Detener reproducción automática
      mpc stop >/dev/null 2>&1

      # Iniciar mpdris2-rs
      exec /usr/local/bin/mpdris2-rs "$@"
    mode: '0755'
  tags: wrapper

- name: Crear directorio systemd user si no existe
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Recrear el archivo de servicio mpdris2-rs con sintaxis corregida
  ansible.builtin.copy:
    dest: "/home/{{ target_user }}/.config/systemd/user/mpdris2-rs.service"
    content: |
      [Unit]
      Description=MPRIS2 Bridge for MPD (Rust implementation)
      After=mpd.service
      After=dbus.socket
      Wants=mpd.service
      Requires=dbus.socket

      [Service]
      Type=simple
      ExecStart=/home/{{ target_user }}/.config/bin/mpdris2-rs-wrapper.sh
      Restart=always
      RestartSec=10
      # Agregar timeout de inicio más largo
      TimeoutStartSec=10

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  register: service_file_created

# ========== Habiliar y arrancar servicios ==========

- name: Obtener UID de user (si no está definido)
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"
  register: user_passwd

- name: Configurar variable UID
  set_fact:
    user_uid: "{{ user_passwd.ansible_facts.getent_passwd[target_user][1] }}"

- name: Habilitar e iniciar servicio mpdris2-rs para el user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  ansible.builtin.systemd:
    name: mpdris2-rs.service
    scope: user
    enabled: true
    state: restarted
    daemon_reload: true
