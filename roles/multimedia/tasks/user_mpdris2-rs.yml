---

# ========== Servicio mpdris2-rs ==========

- name: Crear directorio systemd user si no existe
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Recrear el archivo de servicio mpdris2-rs con sintaxis corregida
  ansible.builtin.copy:
    dest: "/home/{{ target_user }}/.config/systemd/user/mpdris2-rs.service"
    content: |
      [Unit]
      Description=Music Player Daemon D-Bus Bridge
      After=mpd.service
      Wants=mpd.service

      [Service]
      Type=simple
      # Variables críticas para que encuentre el bus de Sway
      Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      Environment=XDG_RUNTIME_DIR=/run/user/1000

      # Espera a que MPD abra el puerto
      ExecStartPre=/usr/bin/bash -c 'until ss -tulpn | grep -q :6600; do sleep 1; done'

      # Ejecución
      ExecStart=/usr/local/bin/mpdris2-rs --host 127.0.0.1:6600

      # REINICIO AGRESIVO (La clave)
      # "always" reinicia el servicio sin importar si salió con error o con éxito.
      Restart=always
      RestartSec=5s
      # Elimina el límite de intentos para que no se rinda nunca
      StartLimitIntervalSec=0

      [Install]
      WantedBy=default.target
    mode: '0644'
  register: service_file_created

# ========== Habiliar y arrancar servicios ==========

- name: Obtener UID de user (si no está definido)
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"
  register: user_passwd

- name: Configurar variable UID
  set_fact:
    user_uid: "{{ user_passwd.ansible_facts.getent_passwd[target_user][1] }}"

- name: Habilitar e iniciar servicio mpdris2-rs para el user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  ansible.builtin.systemd:
    name: mpdris2-rs.service
    scope: user
    enabled: true
    state: restarted
    daemon_reload: true
