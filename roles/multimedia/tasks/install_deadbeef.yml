# ========== Instalación de DeaDBeeF ==========

# Crear directorio temporal para clonar el plugin
- name: Create directory for plugin build
  file:
    path: /tmp/deadbeef-mpris2
    state: directory

# Clonar repositorio del plugin
- name: Clone deadbeef-mpris2-plugin repository
  git:
    repo: "https://github.com/DeaDBeeF-Player/deadbeef-mpris2-plugin.git"
    dest: /tmp/deadbeef-mpris2

# Ejecutar autoreconf
- name: Run autoreconf
  command: autoreconf --install
  args:
    chdir: /tmp/deadbeef-mpris2

# Ejecutar configure
- name: Configure mpris plugin
  command: ./configure --prefix=/usr
  args:
    chdir: /tmp/deadbeef-mpris2

# Compilar el plugin
- name: Build mpris plugin
  command: make
  args:
    chdir: /tmp/deadbeef-mpris2

# Instalar el plugin
- name: Install mpris plugin
  command: make install
  args:
    chdir: /tmp/deadbeef-mpris2
  become: true

# Limpiar directorio de compilación (opcional)
- name: Remove plugin build directory
  file:
    path: /tmp/deadbeef-mpris2
    state: absent

# Tu .deb instalará Deadbeef en: /usr/bin/deadbeef, /usr/lib/deadbeef/
# make install dejará el plugin en /usr/local/lib/deadbeef/
