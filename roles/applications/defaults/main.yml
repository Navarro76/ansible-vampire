---

# Paths correctos y consistentes para become_user
target_home: "/home/{{ target_user }}"

# aria2
aria2_conf_dir: "/home/{{ target_user }}/.config/aria2"
ariang_version: "1.3.7" # Puedes verificar la última en GitHub
systemd_user_dir: "{{ target_home }}/.config/systemd/user"

# typst
typst_install_path: "{{ target_home }}/.cargo/bin"

# Canal de instalación
typst_channel: "stable"        # stable | dev

# Opciones del rol
typst_autoupdate: false
typst_create_wrapper: false

# Typst preview
typst_preview: "none"          # none | cli | nvim | gui


# (firmware, drivers de aceleración de video)
graphics_packages:
  - firmware-amd-graphics
  - libgl1-mesa-dri
  - libglx-mesa0
  - mesa-va-drivers
  - mesa-vdpau-drivers
  - mesa-vulkan-drivers
  - libva-wayland2
  - libva-x11-2
  - libva-drm2
  - vdpau-driver-all
  - vainfo
  - mesa-utils

# (office suites, text editors)
productivity_apps:
  - pandoc
  - libfuse2

# (image, video and audio editors)
creativity_apps:
  - audacity
  - gimp
  - inkscape

# (DAWs, plugins externos LSP y Calf)
audio_recording_apps:
  - easyeffects
  - lsp-plugins
  - calf-plugins
  - mda-lv2
  - zam-plugins

# (optimizers, backup tools, virtualization)
system_tools_apps:
  - vainfo

# (browsers, email clients)
internet_apps:
  - firefox

# (descargas, torrents)
download_apps:
#  - yt-dlp (verión vieja)
  - nodejs
  - amule
  - amule-daemon
  - amule-utils
  - amule-utils-gui
  - amule-gnome-support
  - qbittorrent

# (IDEs, code editors, databases, revision control)
development_apps:
  - geany

# (media players, screen recording)
multimedia_apps:
  - picard
  - easytag
  - ffmpeg
  - mkvtoolnix
  - mkvtoolnix-gui
  - mediainfo

# (emulators, DOSBox-X)
gaming_apps:

# (Firewalls, password managers)
security_apps:
  - nftables
  - keepassxc-full

# APPS CON PROBLEMAS
  - foliate

