---

- name: Descargar la llave GPG de ProtonVPN
  ansible.builtin.get_url:
    url: https://repo.protonvpn.com/debian/public_key.asc
    dest: /usr/share/keyrings/protonvpn-archive-keyring.asc
    mode: '0644'

- name: Crear archivo de repositorio (Debian 13)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/protonvpn.list
    content: "deb [signed-by=/usr/share/keyrings/protonvpn-archive-keyring.asc] https://repo.protonvpn.com/debian stable main"
    mode: '0644'

- name: Actualizar cache de apt
  ansible.builtin.apt:
    update_cache: yes

- name: Instalar Proton-VPN CLI
  ansible.builtin.apt:
    name:
      - proton-vpn-cli
      - proton-vpn-gnome-desktop
    state: present
