---
- name: Instalar dependencias para Psiphon Brainfuck
  apt:
    name: [golang, git, redsocks]
    state: present

- name: Limpiar directorios inconsistentes y asegurar carpetas base
  shell: |
    for DIR in "/home/{{ target_user }}/go/src/github.com/aztecrabbit/brainfuck-psiphon-pro-go" "/home/{{ target_user }}/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core"; do
      if [ -d "$DIR" ] && [ ! -d "$DIR/.git" ]; then rm -rf "$DIR"; fi
      mkdir -p "$(dirname "$DIR")"
    done
  become: true

- name: Clonar repositorios mediante Shell (Resistente a Error 500)
  become_user: "{{ target_user }}"
  shell: |
    if [ ! -d "{{ item.dest }}/.git" ]; then
      git clone {{ item.repo }} {{ item.dest }}
    else
      cd {{ item.dest }} && git pull
    fi
  loop:
    - { repo: "https://github.com/aztecrabbit/brainfuck-psiphon-pro-go.git", dest: "{{ psiphon_dir }}" }
    - { repo: "https://github.com/Psiphon-Labs/psiphon-tunnel-core.git", dest: "/home/{{ target_user }}/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core" }
  register: git_shell_result
  until: git_shell_result.rc == 0
  retries: 5
  delay: 15

