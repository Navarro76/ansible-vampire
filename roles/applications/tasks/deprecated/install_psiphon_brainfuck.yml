- name: Compilar Psiphon Tunnel Core (ConsoleClient)
  become_user: "{{ target_user }}"
  shell: |
    cd /home/{{ target_user }}/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core/ConsoleClient
    # Inicializar módulo si no existe (Psiphon Core suele tenerlo, pero por seguridad)
    [ ! -f go.mod ] && go mod init github.com/Psiphon-Labs/psiphon-tunnel-core/ConsoleClient || true
    go mod tidy
    go build -ldflags "-s -w" -o {{ psiphon_dir }}/psiphon-tunnel-core
  args:
    creates: "{{ psiphon_dir }}/psiphon-tunnel-core"

- name: Compilar Brainfuck Psiphon
  become_user: "{{ target_user }}"
  shell: |
    cd {{ psiphon_dir }}
    # Crear el archivo de módulo necesario para Go 1.17+
    [ ! -f go.mod ] && go mod init github.com/aztecrabbit/brainfuck-psiphon-pro-go || true
    go mod tidy
    go build -ldflags "-s -w" -o brainfuck-psiphon-pro-go
  args:
    creates: "{{ psiphon_dir }}/brainfuck-psiphon-pro-go"

- name: Configurar config.json
  become_user: "{{ target_user }}"
  copy:
    dest: "{{ psiphon_dir }}/config.json"
    content: |
      {
        "ListenPort": 1080,
        "PsiphonCore": 1,
        "Psiphon": {
          "CoreName": "psiphon-tunnel-core",
          "Tunnel": 4,
          "Region": "US",
          "Protocols": ["FRONTED-MEEK-OSSH"],
          "TunnelWorkers": 4,
          "KuotaDataLimit": 0,
          "Authorizations": []
        },
        "Rules": {
          "*:*": ["*"]
        }
      }

